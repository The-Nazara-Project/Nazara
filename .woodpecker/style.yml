matrix:
  RUST: [stable]

steps:
  formatting:
    when:
      - event: push
        branch: main
      - event: pull_request
        branch: main
    image: rust
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - rustup default $RUST
      - rustup component add rustfmt
      - cargo fmt -- --check

  rust-clippy:
    when:
      - event: push
        branch: main
      - event: pull_request
        branch: main
    image: rust
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - rustup default $RUST
      - rustup component add clippy
      - cargo clippy -j 4 --all-targets
