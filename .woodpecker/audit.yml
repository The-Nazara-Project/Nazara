matrix:
  RUST: [stable]

steps:
  audit:
    when:
      - event: push
        branch: main
      - event: pull_request
        branch: main
      - event: cron
        cron: "0 0 1 * *"
    image: dbrgn/cargo-audit:latest
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - cargo build -j 4
      - cargo audit --deny yanked
